services:
  - type: web
    runtime: static
    name: aleks-pay-preview
    plan: free
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.bybit.com; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
      - path: /*
        name: Strict-Transport-Security
        value: 'max-age=63072000; includeSubDomains'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Permissions-Policy
        value: 'accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()'
